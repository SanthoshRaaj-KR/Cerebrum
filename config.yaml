# Cerebrum runtime config. Everything tunable by ear lives here, not
# in code. Secrets (API keys) live in .env instead - see .env.example.

candidate:
  # Calibrates every prompt: question difficulty, depth of follow-ups, and
  # what's assumed as "obviously known" vs worth explaining. Entry-level
  # candidates get simpler system-design scope and more forgiving fundamentals
  # questions than a senior calibration would.
  fresher: true

interviewer:
  # openai or cerebras. Cerebras is much faster (which matters for a spoken
  # interview), so prefer it when its account has credit; openai is the
  # default because it's the one known to work here.
  provider: openai
  # Must be a model the chosen provider actually serves: gpt-4o-mini for
  # openai; gpt-oss-120b or gemma-4-31b for cerebras (the only two this
  # account exposes, checked via /v1/models).
  model: gpt-4o-mini
  # The model for judging, as opposed to asking. Catching a confidently
  # wrong technical claim from a fresher is the hardest thing this system
  # does, and it happens off the critical path (the running score in the
  # background, and the wrong-claim double-check), so it can afford a
  # stronger model than the one asking questions. Must be served by the
  # same provider above. Leave blank to just reuse `model`.
  scorer_model: gpt-4.1-mini
  # Who drives a turn. `code` is the deterministic loop: read the answer,
  # apply the reactive ladder, ask. `agent` is the LLM main agent in
  # agent.py, which calls the evaluator and the questionnaire as tools and
  # decides the move in between - more faithful to a real interviewer's
  # judgement, but ~3 extra model round-trips per question. Either way the
  # question cap, the coverage ledger and the background scorer are
  # enforced in code, and the agent never writes to the candidate.
  coordinator: code
  # When the fast read calls an answer WRONG, take a second focused opinion
  # on scorer_model before that counts against the candidate. Challenging
  # someone over a claim that was actually fine is the worst thing this can
  # do - it wastes a turn, reads as broken, and poisons the scorecard. Costs
  # one extra call, and only on answers actually flagged wrong.
  double_check_wrong: true
  # How many prior turns (question+answer pairs, not messages) stay in the
  # LLM context. Too small and cross-questioning loses the thread; too large
  # and the model spends its window rereading a whole interview each turn.
  # A 40-minute interview runs more turns than a 6-question one used to, so
  # this is higher than it was - the coverage ledger in notes.py is what
  # actually carries the early interview forward once turns fall out of
  # this window.
  remember_turns: 30
  # Modes selectable in the UI, in the order the cards appear. Each needs a
  # matching module in backend/interview_agent/prompts/ registered in that
  # package's __init__. There is no separate role list: the mode IS the
  # role. Each prompt module carries its own DEFAULT_ROLE, which is what
  # gets researched, so nothing is typed in on the way to an interview.
  modes:
    - resume_projects
    - sde_backend
    - computer_fundamentals
    - system_design_hld
    - system_design_lld
    - ai_engineer

interview:
  # No clock and no fixed question list. The interview runs until every
  # competency in the role brief has a read - shown at thin-or-better, or
  # pushed until the edge of what the candidate knows was found - then it
  # wraps up. These two bounds are the floor and ceiling on that: it won't
  # stop before min_questions even if coverage looks done early, and it
  # always wraps by max_questions. max_questions is overridable per session
  # (tools/quality_check.py uses this to keep scripted runs short).
  #
  # Sized for roughly a 30-minute interview: at a couple of minutes per
  # exchange, 15 questions is about right. This is a question budget, not a
  # clock - nothing here is timed and nothing is ever scored on how long an
  # answer took.
  min_questions: 8
  max_questions: 15

research:
  # Before the interview starts, the candidate's target role is researched
  # so the questions are grounded in what companies actually ask a fresher
  # for that role, not just the model's own idea of it. Set to false to
  # skip this and fall back to the model's own knowledge - the interview
  # still runs, just less current.
  enabled: true
  # Search providers, tried in this order. The first one that has a key in
  # .env and returns results grounds the brief; the rest are fallbacks for
  # when it's down or rate-limited. A provider with no key is skipped, so
  # listing brave here costs nothing until you add BRAVE_API_KEY.
  providers:
    - tavily
    - brave
  # A second session on the same role/level/mode reuses the cached brief
  # instead of paying for the search and the distillation call again.
  cache_days: 14
  # Results kept per search query, before the distillation call folds them
  # into the role brief.
  max_results: 5

voice:
  # Dictation only. The candidate may speak their answer instead of typing
  # it; the transcript lands in the answer box and the normal typed flow
  # takes over. The interviewer never speaks back - there is no TTS here
  # and pipeline.py negotiates no outbound audio at all.
  stt:
    provider: deepgram
