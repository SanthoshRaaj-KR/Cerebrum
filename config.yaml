# Cerebrum runtime config. Everything tunable by ear lives here, not
# in code. Secrets (API keys) live in .env instead - see .env.example.

candidate:
  # Calibrates every prompt: question difficulty, depth of follow-ups, and
  # what's assumed as "obviously known" vs worth explaining. Entry-level
  # candidates get simpler system-design scope and more forgiving fundamentals
  # questions than a senior calibration would.
  fresher: true

interviewer:
  # openai or cerebras. Cerebras is much faster (which matters for a spoken
  # interview), so prefer it when its account has credit; openai is the
  # default because it's the one known to work here.
  provider: openai
  # Must be a model the chosen provider actually serves: gpt-4o-mini for
  # openai; gpt-oss-120b or gemma-4-31b for cerebras (the only two this
  # account exposes, checked via /v1/models).
  model: gpt-4o-mini
  # How many prior turns (question+answer pairs, not messages) stay in the
  # LLM context. Too small and cross-questioning loses the thread; too large
  # and the model spends its window rereading a whole interview each turn.
  # A 40-minute interview runs more turns than a 6-question one used to, so
  # this is higher than it was - the coverage ledger in notes.py is what
  # actually carries the early interview forward once turns fall out of
  # this window.
  remember_turns: 30
  # Modes selectable in the UI, in the order the cards appear. Each needs a
  # matching module in backend/interview_agent/prompts/ registered in that
  # package's __init__. There is no separate role list any more - the mode
  # decides the questions, and the candidate types their own target role and
  # level on the résumé screen.
  modes:
    - resume_projects
    - sde_backend
    - computer_fundamentals
    - system_design_hld
    - system_design_lld
    - ai_engineer

interview:
  # There's no question count any more - the interview runs on a clock,
  # like a real one. It opens easy, spends most of the middle on
  # substance, pushes hardest near the end, then wraps up because time is
  # gone. Overridable per session (tools/quality_check.py uses this so a
  # scripted run doesn't take 40 real minutes).
  duration_minutes: 40

research:
  # Before the interview starts, the candidate's target role is researched
  # so the questions are grounded in what companies actually ask a fresher
  # for that role, not just the model's own idea of it. Set to false to
  # skip this and fall back to the model's own knowledge - the interview
  # still runs, just less current.
  enabled: true
  # Only tavily is wired up right now.
  provider: tavily
  # A second session on the same role/level/mode reuses the cached brief
  # instead of paying for the search and the distillation call again.
  cache_days: 14
  # Results kept per search query, before the distillation call folds them
  # into the role brief.
  max_results: 5

voice:
  stt:
    provider: deepgram
  tts:
    # deepgram or cartesia. Deepgram is the default because it does both
    # speech-to-text and text-to-speech off the same key - one less account
    # to hold. Switch to cartesia if you prefer its voices; that needs
    # CARTESIA_API_KEY in .env, which is otherwise not required at all.
    provider: deepgram
    # Voice id. Blank picks the provider's default - aura-2-thalia-en for
    # Deepgram, the account default for Cartesia.
    voice_id: ""
